<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Icons -->
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Global social / SEO -->
		<meta property="og:site_name" content="Bearprompt" />
		<meta property="og:locale" content="en_US" />
		<meta name="twitter:site" content="@bearprompt" />

		<script src="/sensitive-hash-guard.js"></script>

		<!-- Vemetric Analytics -->
		<script nonce="%sveltekit.nonce%">
			window.vmtrcq = window.vmtrcq || [];
			window.vmtrc =
				window.vmtrc ||
				function () {
					window.vmtrcq.push(Array.prototype.slice.call(arguments));
				};
		</script>
		<script
			defer
			src="https://cdn.vemetric.com/main.js"
			id="vmtrc-scr"
			data-token="LWOHzhwizSbPVQn0"
		></script>

		<!-- Bunny Fonts: Bricolage Grotesque + Space Grotesk -->
		<link rel="preconnect" href="https://fonts.bunny.net" />
		<link href="https://fonts.bunny.net/css?family=bricolage-grotesque:400,500,600,700,800|space-grotesk:300,400,500,600,700" rel="stylesheet" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
